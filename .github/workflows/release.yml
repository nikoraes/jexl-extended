name: Release library

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 'Install PNPM'
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: 'Install packages'
        run: pnpm install --no-frozen-lockfile

      - name: 'Generate typedoc'
        run: pnpm run docs:typedoc

      - name: 'Generate completion docs'
        run: pnpm run docs:completion

      - name: 'Build library'
        run: pnpm run build

      - name: 'Generate docs json add add in dist folder'
        run: pnpm run docs:json

      - name: 'Run tests'
        run: pnpm run test

      - name: 'Get npm OIDC token'
        id: oidc
        run: |
          # Fetch the GitHub Actions OIDC token with audience "npm" and pass
          # it to npm as the publish credential (npm trusted publishing).
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          case "$url" in *\?*) sep="&" ;; *) sep="?" ;; esac
          resp=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${url}${sep}audience=npm")
          tok=$(printf '%s' "$resp" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).value))")
          echo "npm_token=${tok}" >> "${GITHUB_OUTPUT}"

      - name: 'Publish library'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ steps.oidc.outputs.npm_token }}
